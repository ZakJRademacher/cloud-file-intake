<!doctype html><html lang="en"><meta charset="utf-8"><title>@@title@@ — portfolio cover</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'Segoe UI',Arial,sans-serif;background:@@canvas@@;color:@@ink@@}.stage{height:100%;padding:52px 54px;position:relative;isolation:isolate;background:radial-gradient(ellipse at 88% 28%,@@primary@@25,transparent 51%),radial-gradient(ellipse at 5% 97%,@@accent@@14,transparent 40%)}.stage:before{content:'';position:absolute;width:700px;height:700px;right:-370px;top:-400px;border:1px solid @@primary@@40;border-radius:50%;box-shadow:0 0 0 70px @@primary@@07,0 0 0 140px @@primary@@04;z-index:-1}.brand{font-size:12px;letter-spacing:2.1px;font-weight:600;display:flex;align-items:center;gap:12px}.brand i{display:block;width:23px;height:23px;background:linear-gradient(140deg,@@primary@@,@@accent@@);border-radius:7px;transform:rotate(-12deg)}main{height:calc(100% - 88px);display:grid;grid-template-columns:39% 61%;align-items:center;gap:20px}.copy{padding-right:25px;animation:copy-in .9s cubic-bezier(.16,.8,.2,1) both}.eyebrow{font-size:11px;color:@@primary@@;font-weight:700;letter-spacing:2px;margin-bottom:28px}h1{font-size:62px;line-height:1.04;font-weight:550;letter-spacing:-2.8px;margin:0 0 26px;max-width:450px}h1:after{content:'';display:block;height:5px;width:65px;border-radius:4px;background:@@accent@@;margin-top:30px}.description{font-size:17px;line-height:1.7;max-width:360px;color:@@muted@@}.format{display:inline-block;margin-top:30px;padding:10px 13px;border:1px solid @@primary@@35;background:@@primary@@0C;border-radius:8px;font-size:11px;letter-spacing:.4px}.frame-wrap{position:relative;perspective:1500px;padding:0 10px 0 0;animation:frame-in 1.1s .1s cubic-bezier(.16,.8,.2,1) both}.frame{padding:10px;border:1px solid @@primary@@35;border-radius:17px;background:@@surface@@;box-shadow:0 30px 85px @@primary@@19,0 4px 14px #00000012;transform:rotate(-2deg)}.chrome{height:30px;display:flex;align-items:center;gap:5px;padding-left:7px}.chrome i{height:5px;width:5px;background:@@muted@@60;border-radius:50%}.chrome span{font-size:9px;letter-spacing:1.2px;margin-left:10px;color:@@muted@@}img{width:100%;max-height:650px;display:block;object-fit:contain;object-position:top;border-radius:8px}.caption{font-size:10px;color:@@muted@@;letter-spacing:.4px;margin:25px 0 0 14px}.tag{position:absolute;right:5px;bottom:56px;width:42px;height:42px;background:@@accent@@;color:@@canvas@@;border:4px solid @@canvas@@;border-radius:13px;display:grid;place-items:center;font-size:23px;box-shadow:0 8px 24px #0002;transform:rotate(8deg)}footer{position:absolute;bottom:42px;left:54px;right:54px;display:flex;justify-content:space-between;border-top:1px solid @@primary@@25;padding-top:18px;font-size:10px;letter-spacing:1.2px;color:@@muted@@}@keyframes copy-in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes frame-in{from{opacity:0;transform:translate(35px,38px) rotate(5deg) scale(.94)}to{opacity:1;transform:none}}@media(max-height:760px){.stage{padding-top:35px}main{grid-template-columns:39% 61%}h1{font-size:52px}.eyebrow{margin-bottom:22px}.description{font-size:15px}.format{margin-top:15px}img{max-height:455px}footer{bottom:25px}.frame-wrap{padding-left:10px}.caption{margin-top:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><div class="stage"><div class="brand"><i></i>ZAK RADEMACHER / SELECTED WORK</div><main><section class="copy"><div class="eyebrow">@@eyebrow@@</div><h1>@@title@@</h1><p class="description">@@description@@</p><span class="format">@@format@@</span></section><section class="frame-wrap"><div class="frame"><div class="chrome"><i></i><i></i><i></i><span>@@frame_label@@</span></div><img src="@@image_data@@" alt="Genuine rendered project preview"></div><div class="tag" aria-hidden="true">↗</div><p class="caption">Genuine working preview · @@preview_note@@</p></section></main><footer><span>INDEPENDENT PORTFOLIO PROJECT</span><span>@@footer@@</span></footer></div></html>
